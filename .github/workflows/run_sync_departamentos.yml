name: Sincronizar Departamentos Isolado

on:
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no Github

jobs:
  run-departamentos-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v3

      - name: Configurando o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv
          
      - name: Executando o Script de Departamentos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_departamentos.py
