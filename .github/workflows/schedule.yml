name: Rotina Noturna Omie ETL

on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (Horário UTC, que é 00:00 no Brasil dependendo do fuso, ajuste conforme necessário)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no Github

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v3

      - name: Configurando o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Executando o Script Principal (Cadastros)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py

      - name: Executando o Script de Movimentos Financeiros
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python movimentos_financeiros_etl.py
