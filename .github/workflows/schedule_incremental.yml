name: Rotina Incremental Omie ETL

on:
  schedule:
    # Roda de hora em hora (no minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no Github

jobs:
  run-etl-incremental:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        empresa:
          - "ALIANÇA LEGAL"
          - "AUDIT TECNOLOGIA"
          - "BRAGA E MONTEIRO"
          - "E-FISCAL OPERACIONAL"
          - "FERREIRA & MONTEIRO"
          - "GS EDUCAÇÃO"
          - "SF CONSULTORIA"
          - "SPACE W"
          - "STUDIO ADMINISTRAÇÃO"
          - "STUDIO AGRONEGÓCIOS"
          - "STUDIO BANK"
          - "STUDIO BROKERS"
          - "STUDIO CONTABILIDADE LTDA"
          - "STUDIO ENERGY"
          - "STUDIO FACTORING"
          - "STUDIO FISCAL"
          - "STUDIO GROWTH"
          - "STUDIO OPERACIONAL"
          - "STUDIO OPERACIONAL 01"
          - "STUDIO PAR"
          - "STUDIO FAMILY"
          - "STUDIO SBS STORE"
          - "STUDIO STORE"
          - "STUDIO VAREJO"
          
    steps:
      - name: Checando o código do repositório
        uses: actions/checkout@v3

      - name: Configurando o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalando dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: "Clientes Incremental: ${{ matrix.empresa }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python clientes_incremental.py "${{ matrix.empresa }}"

      - name: "Contas a Pagar Incremental: ${{ matrix.empresa }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python contas_pagar_incremental.py "${{ matrix.empresa }}"
